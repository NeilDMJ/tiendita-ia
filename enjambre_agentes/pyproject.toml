[project]
name = "enjambre-agentes"
version = "0.2.0"
description = "Ecosistema Multiagente Comercial Multimodal en LangGraph (Tiendita IA)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Orquestación de Agentes y Memoria
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "pydantic>=2.7.0",
    # Proveedores de LLM y Embeddings (models.py)
    "langchain-nvidia-ai-endpoints>=0.1.0",
    "langchain-google-genai>=2.0.0",
    "langchain-groq>=0.1.5",
    "langchain-cohere>=0.1.7",
    "langchain-community>=0.3.0",
    "langchain-ollama>=0.2.0",
    "langchain-openai>=0.2.0",
    "langchain-huggingface>=0.1.0",
    # Base de Datos y Vector Store (PostgreSQL / pgvector)
    "psycopg2-binary>=2.9.9",
    "asyncpg>=0.29.0",
    # Herramientas Auxiliares y APIs
    "tavily-python>=0.5.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "rich>=13.7.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
# Capa declarativa NeMo Guardrails (opcional). Activar con NEMO_GUARDRAILS_ENABLED=true.
# Instalar: uv sync --extra guardrails
guardrails = [
    "nemoguardrails>=0.25.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.uv]
managed = true
